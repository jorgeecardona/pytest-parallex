site_name: pytest-parallex
site_description: "pytest plugin that runs tests in parallel by fork, so a session fixture runs once per run."
site_url: https://cardona-oss.gitlab.io/pytest-parallex/
repo_url: https://gitlab.com/cardona-oss/pytest-parallex
repo_name: cardona-oss/pytest-parallex
copyright: MIT &copy; Jorge Cardona

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [".", "docs"]
      check_paths: true

plugins:
  - search
  - llmstxt:
      markdown_description: "With --parallel=fork, pytest-parallex runs session fixtures once in a controller process and then forks warm workers that inherit them, so a session fixture runs once per run instead of once per worker."
      full_output: llms-full.txt
      sections:
        Usage documentation:
          - index.md
          - benchmarks.md
          - fork-safety-references.md

nav:
  - Home: index.md
  - Benchmarks (and the traps): benchmarks.md
  - Fork-safety notes: fork-safety-references.md
  - Changelog: changelog.md
