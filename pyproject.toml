[project]
# pytest-parallex — parallel test execution where scope="session" means session:
# the controller builds session fixtures once and forks warm workers that inherit them.
name = "pytest-parallex"
dynamic = ["version"]  # the single source of truth is __version__ in src/pytest_parallex/__init__.py (see [tool.hatch.version])
# Kept short: this is the one-line blurb in PyPI search results, which truncates around
# 100-150 chars. The old one ran to 164 and got cut mid-sentence.
description = "Parallel pytest where session fixtures run once for the whole run, not once per worker"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jorge Cardona", email = "jorgeecardona@gmail.com" }]
keywords = [
    "pytest",
    "parallel",
    "fork",
    "xdist",
    "testing",
    "concurrency",
    "session-fixtures",
    "test-speed",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Pytest",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
# >=8.1, not >=8.0: FixtureManager.getfixturedefs took a nodeid string until 8.1 and a
# Node from 8.1 on. session_scope.py passes a Node, so on 8.0 the fork runner dies with
# "AttributeError: 'Function' object has no attribute 'find'" before running a test.
dependencies = ["pytest>=8.1"]

[project.entry-points.pytest11]
parallex = "pytest_parallex.plugin"

[project.optional-dependencies]
# docs are an *extra* (not a uv dependency-group) so external services can install them via pip
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
]

[project.urls]
Homepage = "https://gitlab.com/cardona-oss/pytest-parallex"
Repository = "https://gitlab.com/cardona-oss/pytest-parallex"
Issues = "https://gitlab.com/cardona-oss/pytest-parallex/-/issues"
Changelog = "https://gitlab.com/cardona-oss/pytest-parallex/-/blob/main/CHANGELOG.md"
Documentation = "https://cardona-oss.gitlab.io/pytest-parallex/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
# The version lives as __version__ in the package itself; hatchling reads it (by regex, no import) so
# pyproject and the runtime never disagree. scripts/bump-version rewrites that literal.
path = "src/pytest_parallex/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pytest_parallex"]

[tool.hatch.build.targets.sdist]
include = ["src", "testing", "docs", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.uv]
# After the pre-commit hook auto-bumps __version__ in the package __init__, uv must treat the
# editable install as stale and reinstall it; without the __init__ key the next `make check`
# runs against the old version. (pyproject is already an implicit key; __init__ is the version source.)
cache-keys = [{ file = "pyproject.toml" }, { file = "src/pytest_parallex/__init__.py" }]

[dependency-groups]
# pytest-xdist is a *test* dependency, not a competitor we forgot to remove: the suite
# asserts that our fixtures still resolve to ours when xdist is installed alongside,
# which is the configuration that broke `worker_id` silently.
dev = ["ruff>=0.6", "pyright>=1.1.390", "pytest>=8", "pytest-xdist>=3", "pytest-cov>=6"]

[tool.pytest.ini_options]
testpaths = ["testing"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "testing"]

[tool.ruff.lint]
# Strict: everything on, each opt-out justified.
select = ["ALL"]
ignore = [
    "E501",    # line length is the formatter's job (line-length = 100)
    "COM812",  # trailing commas conflict with `ruff format` (ruff's own recommendation)
    "D1",      # not every helper owes a docstring; the ones that exist explain *why*
    "D401",    # docstrings here are narrative rationale, not imperative summaries
    "ANN401",  # Any is the honest type for pytest internals we patch (FixtureDef slots etc.)
    "SLF001",  # reaching into pytest privates (_pytest.runner, FixtureDef...) IS the plugin
    "PLC0415", # local imports are load-bearing: they defer work past fork/collection time
    "TRY003", "EM101", "EM102",  # inline exception messages; msg-variable style adds noise
    "BLE001",  # best-effort teardown/cleanup paths catch Exception on purpose
    "PLW0603", # the install/uninstall patch pairs keep module-level state via `global`
]

[tool.ruff.lint.per-file-ignores]
"testing/*" = [
    "S101",    # asserts are the point of tests
    "PLR2004", # literal expectations in asserts are clearer than named constants
    "ARG",     # pytest hook/fixture signatures are fixed; params can go unused
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.isort]
known-first-party = ["pytest_parallex"]

[tool.pyright]
include = ["src", "testing"]
extraPaths = ["src"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
# The plugin reaches into pytest privates by design (TestReport._to_json,
# FixtureDef.cached_result, Session._setupstate); everything else stays strict.
reportPrivateUsage = false
venvPath = "."
venv = ".venv"
